<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта Башкортостана (Все 54 района + дороги)</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Полностью отключает любые полосы прокрутки */
    }

    body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .map-container {
        position: relative;
        width: 95%;       /* Карта будет занимать 95% ширины экрана */
        max-width: 1000px;
        max-height: 95%;  /* Не позволяет карте вылезти за пределы экрана */
        display: flex;
        justify-content: center;
        align-items: center;
        /* Изменили тень: убрали жесткий сдвиг вправо на 66px, чтобы она не растягивала экран */
        filter: drop-shadow(66px 15px 25px rgba(0,0,0,0.45));;
    }

    svg { 
        width: 100%; 
        height: auto; 
        max-height: 100vh; /* Гарантирует, что карта влезет по высоте */
        display: block; 
    }

    .cls-1 { fill: #d1a77e; stroke: #8b6b4a; stroke-width: 2; stroke-linejoin: round; }

    /* Все районы — единый стиль, никакого деления на «большие» и «обычные» */
    .cls-2, .cls-3 {
    stroke: #8b6b4a;
    stroke-width: 1;
    stroke-opacity: 0.7;
    stroke-linejoin: round;
    /* transition: filter 0.3s ease;  <-- УДАЛИТЬ */
    transition: fill 0.2s ease; /* Работает только при смене цвета */
}

    .district-label {
        font-size: 4px; font-weight: 700; fill: #633;
        text-anchor: middle; paint-order: stroke;
        stroke: #ffffff; stroke-width: 2px; stroke-linejoin: round;
        pointer-events: none;
        opacity: var(--district-label-opacity);
    }

    .city-name {
        font-size: 6px; font-weight: 500; fill: #1a1a1a;
        text-anchor: middle; paint-order: stroke;
        stroke: #ffffff; stroke-width: 1px; stroke-linejoin: round;
        pointer-events: none;
        opacity: var(--city-label-opacity);
    }

    .blink-active {
        filter: brightness(1.6) drop-shadow(0 0 10px rgba(255,255,255,0.8)) !important;
    }

    :root {
        --road-color: #ffffff;
        --road-width: 2;
        --road-opacity: 0.4;
        --district-label-opacity: 0.8;  /* прозрачность названий районов */
        --city-label-opacity: 0.9;        /* прозрачность названий городов */
    }

    #roads-layer { pointer-events: none; }

    .road-regional {
        fill: none;
        stroke: var(--road-color);
        stroke-width: var(--road-width);
        stroke-opacity: var(--road-opacity);
        stroke-linecap: butt;
        stroke-linejoin: round;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
    }

    .city { pointer-events: none; }
    .city-halo { fill: rgba(255,255,255,0.7); }
    .city-dot { fill: #d63031; stroke: #fff; stroke-width: 0.8; }
    .city-capital .city-dot { fill: #e17055; }
    .city-capital .city-name { font-size: 7px; }

    }

      body.animations-paused *,
      body.animations-paused *::before,
      body.animations-paused *::after {
      animation-play-state: paused !important;
    }

     /* ==========================================
           СКРЫВАЕМ ВЕРХНИЕ КНОПКИ ПРИ ОТКРЫТОМ ПОПАПЕ
           ========================================== */
        body.popup-active #ai-btn-top,
        body.popup-active #effects-toggle,
        body.popup-active #theme-toggle {
            opacity: 0 !important;
            pointer-events: none !important;
            /* Убрали transform, чтобы не было конфликтов с инлайн-стилями */
            transition: opacity 0.3s ease !important;
        }
        
        /* Плавное возвращение кнопок */
        #ai-btn-top, #effects-toggle, #theme-toggle {
            transition: opacity 0.3s ease !important;
        }

   /* ================= ПАВЛОВСКОЕ ВОДОХРАНИЛИЩЕ ================= */
        .water-body {
            fill: #74b9ff; 
            fill-opacity: 0.85; 
            stroke: #0984e3; 
            stroke-width: 1.5;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: drop-shadow(0px 0px 4px rgba(9, 132, 227, 0.6)); 
            pointer-events: none; /* Чтобы вода не перекрывала клики по районам */
        }

 /* ================= ВЕТРОГЕНЕРАТОР ================= */
        @keyframes spin-rotor {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .wind-rotor {
            transform-origin: 0px 0px; /* Вращение вокруг центра */
            animation: spin-rotor 4s linear infinite;
        }

        /* Остановка при выключенных эффектах */
        .effects-off .wind-rotor,
        body.animations-paused .wind-rotor {
            animation-play-state: paused !important;
        }


</style>
</head>
<body>

<div class="map-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428.87 537.69" id="bashkortostan-map">

    /* --- 3D ПЕРЕВОРОТ ВСЕЙ КАРТЫ --- */
            .map-container {
                perspective: 2000px !important;
            }
            
             /* --- КНОПКА ИИ НАВЕРХУ --- */
            #ai-btn-top {
                position: fixed; 
                top: 16px; 
                right: 128px; /* Рядом с кнопками темы и эффектов */
                height: 44px;
                background: #fff;
                color: #000;
                border: 2px solid #000; /* Рамка как на рисунке */
                border-radius: 22px; /* Овальная форма */
                padding: 0 20px 0 10px;
                display: flex; 
                align-items: center; 
                gap: 8px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 700; 
                font-size: 12px; 
                letter-spacing: 0.5px;
                cursor: pointer; 
                z-index: 100002;
                box-shadow: 0 4px 16px rgba(0,0,0,0.25);
                transition: transform 0.2s ease, background 0.2s, color 0.2s;
            }
            
            #ai-btn-top:hover { 
                transform: scale(1.05); 
            }
            
            body.dark-mode #ai-btn-top { 
                background: #2a2a3a; 
                color: #fff; 
                border-color: #ffd166; 
            }

            /* Анимация машущей руки */
            .waving-arm {
                transform-origin: 20px 18px; 
                animation: wave-arm 0.6s ease-in-out infinite alternate;
            }
            @keyframes wave-arm {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(-40deg); } 
            }

        constructor() {

            this.type = Math.random() > 0.5 ? 'horse' : 'marten';

            this.scale = Math.random() * 2.0 + 2.0;

            // Скорость движения

    }

    function initParticles() {
        particles = [];

        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    // Контуры животных (Лошадь и Куница) в виде Path2D
     const horseCloudPath = new Path2D(`
        M 15 70 
        C 5 60, 10 45, 20 40 
        C 15 25, 30 15, 45 25 
        C 55 5, 75 5, 80 25 
        C 95 20, 100 45, 85 55 
        C 90 65, 70 75, 60 65 
        C 55 80, 45 85, 40 70 
        C 30 85, 15 85, 20 70 Z
    `);

    // Куница: вытянутое тело, пышный хвост, маленькая голова
    const martenCloudPath = new Path2D(`
       
    `);

    function drawBackground(timestamp) {
        if (!CONFIG.bgAnimationEnabled) {
            ctx.clearRect(0, 0, width, height);
            return; 
        }

        if (!effectsEnabled) {
            requestAnimationFrame(drawBackground); 
            return;
        }

        if (!timestamp) timestamp = performance.now();
        const fpsInterval = 1000 / CONFIG.bgFps;
        const elapsed = timestamp - lastDrawTime;

        if (elapsed < fpsInterval) {
            requestAnimationFrame(drawBackground);
            return;
        }

        lastDrawTime = timestamp - (elapsed % fpsInterval);

        // --- ОТРИСОВКА ---
        ctx.clearRect(0, 0, width, height);
        const isDark = document.body.classList.contains('dark-mode');
        const time = Date.now();

        particles.forEach(p => {
            if (!isDark) {
                // ☁️ ДНЕВНЫЕ ОБЛАКА В ФОРМЕ ЖИВОТНЫХ
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < -200) p.x = width + 200;
                if (p.x > width + 200) p.x = -200;
                if (p.y < -200) p.y = height + 200;
                if (p.y > height + 200) p.y = -200;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.scale(p.scale, p.scale);
                
                // 🎯 ДВОЙНОЕ РАЗМЫТИЕ ДЛЯ ЭФФЕКТА ОБЛАКА
                
                // 1. Широкая и мягкая основа (ореол)
                ctx.filter = 'blur(6px)'; 
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; 
                if (p.type === 'horse') {
                    ctx.fill(horseCloudPath);
                } else {
                    ctx.fill(martenCloudPath);
                }

                // 2. Более плотная и четкая середина (силуэт)
                ctx.filter = 'blur(2px)'; 
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                if (p.type === 'horse') {
                    ctx.fill(horseCloudPath);
                } else {
                    ctx.fill(martenCloudPath);
                }
                
                ctx.restore();

            } else {
                // ⭐ НОЧНЫЕ ЗВЕЗДЫ
                const opacity = (Math.sin(time * CONFIG.starTwinkleSpeed + p.offset) * 0.5 + 0.5);
                ctx.beginPath();
                const starSize = p.scale * 0.8; 
                ctx.arc(p.x, p.y, starSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fill();
            }
        });

        requestAnimationFrame(drawBackground);
    }

    function createFadeSlideshow(parentG, folder, bbox) {
        const wrap = document.createElementNS(svgNS, 'g');
        parentG.appendChild(wrap);

        let currentImg = null, stopped = false, idx = 1, nextTimerHandle = null, safetyTimer = null;

        function makeImg(num) {
            const img = document.createElementNS(svgNS, 'image');
            img.setAttribute('x', bbox.x); img.setAttribute('y', bbox.y);
            img.setAttribute('width', bbox.width); img.setAttribute('height', bbox.height);
            img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
            img.style.transition = `opacity ${CONFIG.fadeDurationMs}ms ease`;
            img.style.opacity = '0';
            const fullSrc = `${folder}/${num}.jpg`;
            img.setAttribute('href', fullSrc);
            img.setAttributeNS(xlinkNS, 'xlink:href', fullSrc);
            return img;
        }

        function scheduleNext() { if (!stopped) nextTimerHandle = setTimeout(step, CONFIG.photoIntervalMs); }

        function step() {
            if (stopped) return;
            const targetNum = idx;
            idx = (idx % CONFIG.photoCount) + 1;
            const nextImg = makeImg(targetNum);
            wrap.appendChild(nextImg);

            let swapped = false;
            const swap = () => {
                if (swapped) return;
                swapped = true;
                if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
                if (stopped) { try { wrap.removeChild(nextImg); } catch(e){} return; }
                requestAnimationFrame(() => {
                    nextImg.style.opacity = '1';
                    const old = currentImg;
                    if (old && old !== nextImg) {
                        old.style.opacity = '0';
                        setTimeout(() => { try { wrap.removeChild(old); } catch(e){} }, CONFIG.fadeDurationMs + 60);
                    }
                    currentImg = nextImg;
                });
                scheduleNext();
            };

            nextImg.addEventListener('load', swap);
            nextImg.addEventListener('error', swap);
            safetyTimer = setTimeout(swap, 3000);
        }

        step();
        return { stop() { stopped = true; if (nextTimerHandle) clearTimeout(nextTimerHandle); if (safetyTimer) clearTimeout(safetyTimer); } };
    }

        }

    const planeLayer = document.createElementNS(svgNS, 'g');
    planeLayer.id = 'plane-layer';
    planeLayer.style.pointerEvents = 'none';
    svg.insertBefore(planeLayer, photoLayer);

    function spawnPlane() {
        // Если эффекты выключены или открыто окно района — не спавним новые
        if (!effectsEnabled || window.isPaused) return;

        const targetX = 175; 
        const targetY = 195;

        const theta = Math.random() * Math.PI * 2; 
        const radius = 250 + Math.random() * 100; 
        
        const startX = targetX + Math.cos(theta) * radius;
        const startY = targetY + Math.sin(theta) * radius;

        const midX = (startX + targetX) / 2;
        const midY = (startY + targetY) / 2;
        
        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        const nx = -dy / dist;
        const ny = dx / dist;
        
        const sign = Math.random() > 0.5 ? 1 : -1;
        const randomCurve = CONFIG.planeCurvature * (0.5 + Math.random());
        const offset = dist * randomCurve * sign;
        
        const cx = midX + nx * offset;
        const cy = midY + ny * offset;

        const vg = document.createElementNS(svgNS, 'g');
        
        const shadow = document.createElementNS(svgNS, 'ellipse');
        shadow.setAttribute('cx', '0'); shadow.setAttribute('cy', '4');
        shadow.setAttribute('rx', '12'); shadow.setAttribute('ry', '5');
        shadow.setAttribute('fill', 'rgba(0,0,0,0.2)');
        vg.appendChild(shadow);

        const body = document.createElementNS(svgNS, 'rect');
        body.setAttribute('x', '-3'); body.setAttribute('y', '-15');
        body.setAttribute('width', '6'); body.setAttribute('height', '30');
        body.setAttribute('rx', '3');
        body.setAttribute('fill', '#f8f9fa'); body.setAttribute('stroke', '#adb5bd'); body.setAttribute('stroke-width', '0.5');
        vg.appendChild(body);

        const wings = document.createElementNS(svgNS, 'path');
        wings.setAttribute('d', 'M -3 -3 L -16 5 L -16 9 L -3 5 Z M 3 -3 L 16 5 L 16 9 L 3 5 Z');
        wings.setAttribute('fill', '#e9ecef'); wings.setAttribute('stroke', '#adb5bd'); wings.setAttribute('stroke-width', '0.5'); wings.setAttribute('stroke-linejoin', 'round');
        vg.appendChild(wings);

        const tail = document.createElementNS(svgNS, 'path');
        tail.setAttribute('d', 'M -2 10 L -8 14 L -8 16 L -2 13 Z M 2 10 L 8 14 L 8 16 L 2 13 Z');
        tail.setAttribute('fill', '#e9ecef'); tail.setAttribute('stroke', '#adb5bd'); tail.setAttribute('stroke-width', '0.5'); tail.setAttribute('stroke-linejoin', 'round');
        vg.appendChild(tail);

        const cabin = document.createElementNS(svgNS, 'ellipse');
        cabin.setAttribute('cx', '0'); cabin.setAttribute('cy', '-10');
        cabin.setAttribute('rx', '2'); cabin.setAttribute('ry', '4');
        cabin.setAttribute('fill', '#2c3e50');
        vg.appendChild(cabin);

        planeLayer.appendChild(vg);

        let startTime = null;
        let pausedTime = 0; // Переменная для запоминания времени паузы
        
        function animatePlane(timestamp) {
            // Если игра на паузе, замораживаем самолет
            if (window.isPaused) {
                if (pausedTime === 0) {
                    pausedTime = timestamp;
                }
                requestAnimationFrame(animatePlane);
                return;
            } else {
                // Если пауза снята, корректируем время старта, чтобы не было рывка
                if (pausedTime !== 0) {
                    if (startTime) startTime += (timestamp - pausedTime);
                    pausedTime = 0;
                }
            }

            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) / CONFIG.planeDurationMs;
            
            if (progress >= 1) {
                if (vg.parentNode) vg.parentNode.removeChild(vg);
                return;
            }

            const t = progress;
            
            const x = (1-t)*(1-t)*startX + 2*(1-t)*t*cx + t*t*targetX;
            const y = (1-t)*(1-t)*startY + 2*(1-t)*t*cy + t*t*targetY;
            
            const dx_t = 2*(1-t)*(cx-startX) + 2*t*(targetX-cx);
            const dy_t = 2*(1-t)*(cy-startY) + 2*t*(targetY-cy);
            const angle = Math.atan2(dy_t, dx_t) * 180 / Math.PI + 90;

            let scale = CONFIG.planeScale;
            if (t > 0.7) {
                const landingProgress = (t - 0.7) / 0.3;
                scale = CONFIG.planeScale - (CONFIG.planeScale - CONFIG.planeEndScale) * landingProgress;
            }

            vg.setAttribute('transform', `translate(${x}, ${y}) rotate(${angle}) scale(${scale})`);
            
            requestAnimationFrame(animatePlane);
        }

        requestAnimationFrame(animatePlane);
    }

    // Вызов самолета тоже проверяет паузу
    setInterval(() => {
        if (!window.isPaused) spawnPlane();
    }, CONFIG.planeIntervalMs);
    
    setTimeout(() => {
        if (!window.isPaused) spawnPlane();
    }, 2000);

    function applyMountainRelief() {
        let defs = svg.querySelector('defs');
        if (!defs) {
            defs = document.createElementNS(svgNS, 'defs');
            svg.insertBefore(defs, svg.firstChild);
        }

        const districtParams = {};
        Object.values(CONFIG.mountainSystems).forEach(sys => {
            sys.districts.forEach(name => {
                districtParams[name] = sys;
            });
        });

        let idx = 0;
        allDistricts.forEach(path => {
            const name = path.dataset.districtName;
            const cfg = districtParams[name];
            if (!cfg) return;

            const fid = 'relief-' + (idx++);
            const filter = document.createElementNS(svgNS, 'filter');
            filter.setAttribute('id', fid);
            filter.setAttribute('filterUnits', 'userSpaceOnUse');
            filter.setAttribute('x', '0');
            filter.setAttribute('y', '0');
            filter.setAttribute('width', '428.87');
            filter.setAttribute('height', '537.69');
            filter.setAttribute('color-interpolation-filters', 'sRGB');

            // 1. Шум — ваш рабочий вариант (без вытягивания, без искажений)
            const noise = document.createElementNS(svgNS, 'feTurbulence');
            noise.setAttribute('type', 'fractalNoise');
            noise.setAttribute('baseFrequency', String(cfg.freq)); // как было
            noise.setAttribute('numOctaves', '7');                 // как было
            noise.setAttribute('seed', String(cfg.seed));          // как было
            noise.setAttribute('result', 'noise');
            filter.appendChild(noise);

            // 1.5. ЛЁГКИЙ ИЗГИБ (feDisplacementMap с очень маленьким scale)
            // Создаём очень плавный шум для искривления (низкая частота)
            const warp = document.createElementNS(svgNS, 'feTurbulence');
            warp.setAttribute('type', 'fractalNoise');
            warp.setAttribute('baseFrequency', '0.002 0.004'); // плавные волны
            warp.setAttribute('numOctaves', '1');
            warp.setAttribute('seed', '1');
            warp.setAttribute('result', 'warp');
            filter.appendChild(warp);

            const displace = document.createElementNS(svgNS, 'feDisplacementMap');
            displace.setAttribute('in', 'noise');
            displace.setAttribute('in2', 'warp');
            displace.setAttribute('scale', '8'); // <-- МАЛЕНЬКИЙ scale! Не размывает, а только изгибает
            displace.setAttribute('xChannelSelector', 'R');
            displace.setAttribute('yChannelSelector', 'G');
            displace.setAttribute('result', 'curvedNoise');
            filter.appendChild(displace);

            // 2. В серый — чтобы свет корректно читал высоты
            const gray = document.createElementNS(svgNS, 'feColorMatrix');
            gray.setAttribute('type', 'saturate');
            gray.setAttribute('values', '0');
            gray.setAttribute('in', 'curvedNoise'); // берём уже изогнутый шум
            gray.setAttribute('result', 'gray');
            filter.appendChild(gray);

            // 3. Свет сверху-слева создаёт тени/блики
            const lighting = document.createElementNS(svgNS, 'feDiffuseLighting');
            lighting.setAttribute('in', 'gray');
            lighting.setAttribute('lighting-color', '#ffffff');
            lighting.setAttribute('surfaceScale', String(cfg.scale));
            lighting.setAttribute('diffuseConstant', '1.3');
            lighting.setAttribute('result', 'hillshade');
            const dLight = document.createElementNS(svgNS, 'feDistantLight');
            dLight.setAttribute('azimuth', String(cfg.azimuth || 315));
            dLight.setAttribute('elevation', '45');
            lighting.appendChild(dLight);
            filter.appendChild(lighting);

            // 4. Усиливаем контраст теней
            const ct = document.createElementNS(svgNS, 'feComponentTransfer');
            ct.setAttribute('in', 'hillshade');
            ct.setAttribute('result', 'enhanced');
            ['R', 'G', 'B'].forEach(ch => {
                const f = document.createElementNS(svgNS, 'feFunc' + ch);
                f.setAttribute('type', 'linear');
                f.setAttribute('slope', '0.8');     // Контраст (меньше = мягче)
                f.setAttribute('intercept', '0.3'); // Тени (больше = светлее и серее)
            });
            filter.appendChild(ct);

            // 5. Накладываем светотень на цвет района
            const blend = document.createElementNS(svgNS, 'feBlend');
            blend.setAttribute('in', 'SourceGraphic');
            blend.setAttribute('in2', 'enhanced');
            blend.setAttribute('mode', 'multiply');
            blend.setAttribute('result', 'blended');
            filter.appendChild(blend);

            // 6. Обрезаем строго по контуру района
            const composite = document.createElementNS(svgNS, 'feComposite');
            composite.setAttribute('in', 'blended');
            composite.setAttribute('in2', 'SourceGraphic');
            composite.setAttribute('operator', 'in');
            filter.appendChild(composite);

            defs.appendChild(filter);
            path.setAttribute('filter', `url(#${fid})`);
        });
    }

    applyMountainRelief();

    // Поиск случайной точки внутри района
    function getRandomPointInPath(path) {
        const bbox = path.getBBox(); 
        const pt = svg.createSVGPoint();
        for (let i = 0; i < 200; i++) {
            pt.x = bbox.x + Math.random() * bbox.width;
            pt.y = bbox.y + Math.random() * bbox.height;
            if (path.isPointInFill(pt)) return { x: pt.x, y: pt.y };
        }
        return { x: bbox.x + bbox.width / 2, y: bbox.y + bbox.height / 2 };
    }

     // --- ЛОГИКА ПОЯВЛЕНИЯ И ЕСТЕСТВЕННОГО ДВИЖЕНИЯ ---
    let isAnimalVisible = false;

    function spawnRandomAnimal() {
        if (!effectsEnabled) return;
        if (isAnimalVisible || zoomPopup || currentDistrict) return;

        const availableAnimals = Object.keys(CONFIG.animals);
        const animalType = availableAnimals[Math.floor(Math.random() * availableAnimals.length)];
        const animalCfg = CONFIG.animals[animalType];
        
        let pathsToRoam = [];
        
        // Универсальная функция поиска районов
        const getPaths = (names) => {
            const result = [];
            names.forEach(name => {
                const p = Array.from(allDistricts).find(el => 
                    el.getAttribute('data-name') === name || 
                    el.getAttribute('data-district-name') === name
                );
                if (p) result.push(p);
            });
            return result;
        };

        if (animalType === 'bear') {
            pathsToRoam = getPaths(['Белорецкий', 'Зилаирский', 'Ишимбайский', 'Караидельский', 'Бурзянский', 'Гафурийский']);
        } else if (animalType === 'horse') {
            pathsToRoam = getPaths(['Баймакский', 'Абзелиловский', 'Учалинский', 'Зианчуринский', 'Хайбуллинский']);
        } else if (animalType === 'eagle') {
            pathsToRoam = getPaths(['Хайбуллинский', 'Зианчуринский']);
        } else if (animalType === 'bee') {
            // ДОБАВЛЕНО ДЛЯ ПЧЕЛЫ: 3 района
            pathsToRoam = getPaths(['Бурзянский', 'Белорецкий', 'Зилаирский']);
        } else {
            if (animalCfg && animalCfg.districts) {
                const randomDistrictName = animalCfg.districts[Math.floor(Math.random() * animalCfg.districts.length)];
                const p = Array.from(allDistricts).find(el => 
                    el.getAttribute('data-name') === randomDistrictName || 
                    el.getAttribute('data-district-name') === randomDistrictName
                );
                if (p) pathsToRoam.push(p);
            }
        }

        if (pathsToRoam.length === 0) return;

        // ==========================================
        // ОСОБАЯ ЛОГИКА ДЛЯ ЛЕТАЮЩИХ (Орел и Пчела)
        // ==========================================
        if (animalType === 'eagle' || animalType === 'bee') {
            if (pathsToRoam.length < 2) return; // Нужно минимум 2 района для полета
            
            // Выбираем стартовый и конечный районы (они должны быть разными)
            const startPath = pathsToRoam[Math.floor(Math.random() * pathsToRoam.length)];
            let endPath = pathsToRoam[Math.floor(Math.random() * pathsToRoam.length)];
            while (endPath === startPath && pathsToRoam.length > 1) {
                endPath = pathsToRoam[Math.floor(Math.random() * pathsToRoam.length)];
            }

            const startPos = getRandomPointInPath(startPath);
            const endPos = getRandomPointInPath(endPath);
            
            if (!startPos || !endPos) return;

            const midX = (startPos.x + endPos.x) / 2;
            const midY = (startPos.y + endPos.y) / 2;
            const dx = endPos.x - startPos.x;
            const dy = endPos.y - startPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist === 0) return; 

            const nx = -dy / dist;
            const ny = dx / dist;
            const sign = Math.random() > 0.5 ? 1 : -1;
            // Изгиб траектории (для пчелы можно сделать чуть более виляющий полет)
            const offset = dist * (animalType === 'bee' ? 0.4 : 0.3) * sign; 
            const cx = midX + nx * offset;
            const cy = midY + ny * offset;

            const wrapper = document.createElementNS(svgNS, 'g');
            // Масштаб (пчела меньше орла)
            const scale = CONFIG.animalScale * (animalCfg.scaleMultiplier || 1) * (animalType === 'eagle' ? 1.5 : 1); 
            
            const animalContent = animalType === 'eagle' ? createEagle() : createBee();
            
            animalContent.setAttribute('class', 'animal-fly animal-shadow');
            wrapper.appendChild(animalContent);
            wrapper.style.opacity = '0';
            wrapper.style.transition = 'opacity 1s ease';
            
            animalLayer.appendChild(wrapper);
            isAnimalVisible = true;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => { wrapper.style.opacity = '1'; });
            });

            // Пчела летит быстрее орла (6 секунд против 8)
            const duration = animalType === 'eagle' ? 8000 : 6000; 
            const startTime = performance.now();

            function animateFlyer(time) {
                const elapsed = time - startTime;
                const t = Math.min(elapsed / duration, 1);

                // Формула кривой Безье
                const x = (1-t)*(1-t)*startPos.x + 2*(1-t)*t*cx + t*t*endPos.x;
                const y = (1-t)*(1-t)*startPos.y + 2*(1-t)*t*cy + t*t*endPos.y;
                
                // Вычисляем угол наклона (производная)
                const dx_t = 2*(1-t)*(cx-startPos.x) + 2*t*(endPos.x-cx);
                const dy_t = 2*(1-t)*(cy-startPos.y) + 2*t*(endPos.y-cy);
                const angle = Math.atan2(dy_t, dx_t) * 180 / Math.PI + 90;

                // Плавное уменьшение при подлете к концу (исчезновение вдали)
                let currentScale = scale;
                if (t > 0.8) {
                    currentScale = scale * (1 - (t - 0.8) / 0.2 * 0.5); 
                }

                wrapper.setAttribute('transform', `translate(${x}, ${y}) rotate(${angle}) scale(${currentScale})`);

                if (t < 1) {
                    requestAnimationFrame(animateFlyer);
                } else {
                    wrapper.style.opacity = '0';
                    setTimeout(() => {
                        if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
                        isAnimalVisible = false;
                    }, 1000);
                }
            }

            requestAnimationFrame(animateFlyer);
            return; 
        }

        // ==========================================
        // СТАНДАРТНАЯ ЛОГИКА (Для медведя, лошади, косули)
        // ==========================================
        const initialPath = pathsToRoam[Math.floor(Math.random() * pathsToRoam.length)];
        const startPos = getRandomPointInPath(initialPath);
        if (!startPos) return;

        let animalContent;
        let isFlying = false;

        switch(animalType) {
            case 'bear': animalContent = createBear(); break;
            case 'horse': animalContent = createHorse(); break;
            case 'roedeer': animalContent = createRoeDeer(); break;
            default: return;
        }

        const wrapper = document.createElementNS(svgNS, 'g');
        const scale = CONFIG.animalScale * (animalCfg.scaleMultiplier || 1);
        
        let currentX = startPos.x;
        let currentY = startPos.y;
        let targetX = currentX;
        let targetY = currentY;
        let flip = 1; 
        
        let speed = 10; 
        if (animalType === 'bear' || animalType === 'horse') speed = 14; 
        
        animalContent.setAttribute('class', 'animal-walk animal-shadow');
        
        wrapper.appendChild(animalContent);
        wrapper.style.opacity = '0';
        wrapper.style.transition = 'opacity 1s ease';
        
        animalLayer.appendChild(wrapper);
        isAnimalVisible = true;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => { wrapper.style.opacity = '1'; });
        });

        let lastTime = performance.now();
        let isAlive = true;

        function pickNewTarget() {
            const chosenPath = pathsToRoam[Math.floor(Math.random() * pathsToRoam.length)];
            const newTarget = getRandomPointInPath(chosenPath);
            if (newTarget) {
                targetX = newTarget.x;
                targetY = newTarget.y;
            }
        }

        pickNewTarget(); 

        function moveLoop(time) {
            if (!isAlive) return;
            
            const dt = (time - lastTime) / 1000; 
            lastTime = time;

            const dx = targetX - currentX;
            const dy = targetY - currentY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 2) {
                pickNewTarget();
            } else {
                const moveX = (dx / dist) * speed * dt;
                const moveY = (dy / dist) * speed * dt;
                
                currentX += moveX;
                currentY += moveY;

                if (Math.abs(dx) > 0.5) {
                    if (dx > 0 && flip === -1) flip = 1;
                    if (dx < 0 && flip === 1) flip = -1;
                }

                wrapper.setAttribute('transform', `translate(${currentX}, ${currentY}) scale(${scale * flip}, ${scale})`);
            }

            requestAnimationFrame(moveLoop);
        }

        requestAnimationFrame(moveLoop);

        setTimeout(() => {
            isAlive = false;
            wrapper.style.opacity = '0';
            setTimeout(() => {
                if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
                isAnimalVisible = false;
            }, 1000);
        }, CONFIG.animalVisibleDurationMs);
    }

    let isShipVisible = false;

    function spawnCruiseShip() {
    if (!effectsEnabled) return;
        if (isShipVisible || zoomPopup || currentDistrict) return;

        const ship = createCruiseShip();
        shipLayer.appendChild(ship);
        isShipVisible = true;

        const totalLength = shipPath.getTotalLength();
        let startTime = performance.now();
        const totalDuration = CONFIG.shipArriveMs + CONFIG.shipStayMs + CONFIG.shipDepartMs;

        let currentAngle = 0;

        function animateShip(time) {
            const elapsed = time - startTime;
            let currentLength = 0;
            let isReturning = false;
            let isDocked = false;

            if (elapsed < CONFIG.shipArriveMs) {
                const t = elapsed / CONFIG.shipArriveMs;
                currentLength = t * totalLength;
            } else if (elapsed < CONFIG.shipArriveMs + CONFIG.shipStayMs) {
                currentLength = totalLength;
                isDocked = true;
            } else if (elapsed < totalDuration) {
                const t = (elapsed - (CONFIG.shipArriveMs + CONFIG.shipStayMs)) / CONFIG.shipDepartMs;
                currentLength = totalLength - t * totalLength;
                isReturning = true;
            } else {
                if (ship.parentNode) ship.parentNode.removeChild(ship);
                isShipVisible = false;
                return;
            }

            const pt = shipPath.getPointAtLength(currentLength);
            
            let dx, dy;
            if (isReturning) {
                const prevLength = Math.max(currentLength - 2, 0);
                const prevPt = shipPath.getPointAtLength(prevLength);
                dx = prevPt.x - pt.x;
                dy = prevPt.y - pt.y;
            } else {
                const nextLength = Math.min(currentLength + 2, totalLength);
                const nextPt = shipPath.getPointAtLength(nextLength);
                dx = nextPt.x - pt.x;
                dy = nextPt.y - pt.y;
            }

            if (dx !== 0 || dy !== 0) {
                currentAngle = Math.atan2(dy, dx) * 180 / Math.PI;
            }

            if (isDocked) {
                currentAngle = Math.sin(time / 500) * 3;
            }

            // Проверяем, не перевернулся ли корабль
            const scaleY = Math.cos(currentAngle * Math.PI / 180) < 0 ? -CONFIG.shipScale : CONFIG.shipScale;

            let opacity = 1;
            if (elapsed < 1500) opacity = elapsed / 1500;
            if (elapsed > totalDuration - 1500) opacity = (totalDuration - elapsed) / 1500;

            ship.setAttribute('transform', `translate(${pt.x}, ${pt.y}) rotate(${currentAngle}) scale(${CONFIG.shipScale}, ${scaleY})`);
            ship.style.opacity = opacity;

            requestAnimationFrame(animateShip);
        }

        requestAnimationFrame(animateShip);
    }

     // --- Логика движения комбайна ---
    function init() {
        const svgMap = document.getElementById('bashkortostan-map');
        if (!svgMap) return;

        const combine = createCombine();
        const SCALE = 0.3; 

        let startPos = null;
        let endPos = null;
        const labels = document.querySelectorAll('.district-label');
        
        for (const label of labels) {
            if (label.textContent.trim() === 'Чекмагушевский') {
                startPos = { x: parseFloat(label.getAttribute('x')), y: parseFloat(label.getAttribute('y')) };
            }
            if (label.textContent.trim() === 'Благоварский') {
                endPos = { x: parseFloat(label.getAttribute('x')), y: parseFloat(label.getAttribute('y')) };
            }
        }

        if (!startPos || !endPos) return;

        combine.style.opacity = '0';
        combine.style.transition = 'opacity 0.8s ease';
        combine.setAttribute('transform', `translate(${startPos.x}, ${startPos.y}) scale(${SCALE})`);
        svgMap.appendChild(combine);

        // Универсальная функция проверки паузы
        function isEverythingPaused() {
            // 1. Открыта карточка района (клик по району)
            if (window.isMapPaused) return true;
            
            // 2. Ваша кнопка нажала на паузу (проверяем состояние SVG)
            if (svgMap.animationsPaused && svgMap.animationsPaused()) return true;

            // 3. Если у вас кнопка вешает класс на body (проверяем на всякий случай)
            if (document.body.classList.contains('animations-paused') || 
                document.body.classList.contains('no-animations')) {
                return true;
            }

            return false;
        }

        function playCombineCycle() {
            if (isEverythingPaused()) {
                setTimeout(playCombineCycle, 1000);
                return;
            }

            combine.style.opacity = '1';
            combine.setAttribute('transform', `translate(${startPos.x}, ${startPos.y}) scale(${SCALE})`);

            const duration = 5000; 
            let startTime = performance.now();
            let pausedTime = 0;

            function animate(time) {
                if (isEverythingPaused()) {
                    if (pausedTime === 0) pausedTime = time;
                    // Ждем 100мс и проверяем снова
                    setTimeout(() => requestAnimationFrame(animate), 100);
                    return;
                } else {
                    if (pausedTime !== 0) {
                        startTime += (time - pausedTime);
                        pausedTime = 0;
                    }
                }

                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentX = startPos.x + (endPos.x - startPos.x) * progress;
                const currentY = startPos.y + (endPos.y - startPos.y) * progress;
                
                combine.setAttribute('transform', `translate(${currentX}, ${currentY}) scale(${SCALE})`);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    combine.style.opacity = '0';
                }
            }

            requestAnimationFrame(animate);
        }

        setTimeout(() => {
            playCombineCycle(); 
            setInterval(() => {
                if (!isEverythingPaused()) {
                    playCombineCycle();
                }
            }, 15000); 
        }, 2000); 
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // АВТОМАТИЧЕСКОЕ ПЕРЕКЛЮЧЕНИЕ ТЕМЫ ПО ВРЕМЕНИ
    // ==========================================
    let userManuallyChangedTheme = false; // Флаг, чтобы не мешать пользователю, если он нажмет кнопку сам

    function applyTimeBasedTheme() {
        // Если пользователь сам нажал на кнопку темы, авторежим отключается
        if (userManuallyChangedTheme) return;

        const currentHour = new Date().getHours();
        
        // Если время от 19:00 до 07:59 — включаем ночь
        if (currentHour >= 19 || currentHour < 8) {
            if (!document.body.classList.contains('dark-mode')) {
                document.body.classList.add('dark-mode');
                // Если у вас есть кнопка переключения темы, можно менять на ней иконку
                // const themeBtn = document.getElementById('theme-toggle');
                // if (themeBtn) themeBtn.textContent = '☀️'; 
            }
        } else {
            // Если время от 08:00 до 18:59 — включаем день
            if (document.body.classList.contains('dark-mode')) {
                document.body.classList.remove('dark-mode');
                // const themeBtn = document.getElementById('theme-toggle');
                // if (themeBtn) themeBtn.textContent = '🌙';
            }
        }
    }



    // 1. Применяем тему сразу при загрузке страницы
    applyTimeBasedTheme();

    // 2. Проверяем время каждую минуту (на случай, если вкладка открыта очень долго)
    setInterval(applyTimeBasedTheme, 60000);

    setTimeout(() => {
        // Ищем контур Караидельского района
        const karaidelPath = Array.from(allDistricts).find(el => 
            el.getAttribute('data-name') === 'Караидельский' || 
            el.getAttribute('data-district-name') === 'Караидельский'
        );

        if (!karaidelPath) {
            console.warn("Караидельский район не найден для отрисовки воды.");
            return;
        }

        // Получаем координаты и размеры района
        const bbox = karaidelPath.getBBox();
        
        // Вычисляем центр района
        const centerX = bbox.x + bbox.width / 2;
        const centerY = bbox.y + bbox.height / 2;

        // Создаем слой для воды (вставляем его перед слоем городов, чтобы вода была под ними)
        const waterLayer = document.createElementNS(svgNS, 'g');
        waterLayer.id = 'water-layer';
        
        // Находим слой городов, чтобы вставить воду ПЕРЕД ним
        const citiesLayer = document.getElementById('cities-layer');
        if (citiesLayer) {
            svg.insertBefore(waterLayer, citiesLayer);
        } else {
            svg.appendChild(waterLayer);
        }

        // Рисуем водохранилище (изогнутую реку)
        // Координаты заданы относительно центра Караидельского района
        const waterPath = document.createElementNS(svgNS, 'path');
        waterPath.setAttribute('class', 'water-body');
        
        // Формула пути (кривые Безье), чтобы река красиво изгибалась
        // Начинаем чуть южнее (ниже) района и уходим на северо-восток
        const pathD = `
            M ${centerX + 10} ${centerY + 20} 
            C ${centerX - 60} ${centerY + 10}, ${centerX + 10} ${centerY + 10}, ${centerX + 10} ${centerY} 
            Z
        `;
        
        waterPath.setAttribute('d', pathD);
        waterLayer.appendChild(waterPath);
        
        console.log("✅ Павловское водохранилище успешно добавлено в Караидельский район.");

// ==========================================
    // ВЕТРОГЕНЕРАТОР В ТУЙМАЗИНСКОМ РАЙОНЕ (3D)
    // ==========================================
    
    // 👇 НАСТРОЙКИ (МЕНЯЙТЕ ЗДЕСЬ) 👇
    const WIND_X = 55;       // Координата X
    const WIND_Y = 220;      // Координата Y
    const WIND_SCALE = 0.3;  // Размер
    // 👆 ------------------------ 👆

    function createWindTurbine(x, y, scale) {
        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('transform', `translate(${x}, ${y}) scale(${scale})`);

        // Тень на земле
        const shadow = document.createElementNS(svgNS, 'ellipse');
        shadow.setAttribute('cx', '2'); shadow.setAttribute('cy', '2');
        shadow.setAttribute('rx', '8'); shadow.setAttribute('ry', '3');
        shadow.setAttribute('fill', 'rgba(0,0,0,0.4)');
        g.appendChild(shadow);

        // 1. БАШНЯ (3D: две грани)
        const towerLeft = document.createElementNS(svgNS, 'polygon');
        towerLeft.setAttribute('points', '-3,0 -1.5,-50 0,-50 0,0');
        towerLeft.setAttribute('fill', '#95a5a6'); // Темная грань
        g.appendChild(towerLeft);

        const towerRight = document.createElementNS(svgNS, 'polygon');
        towerRight.setAttribute('points', '0,0 0,-50 1.5,-50 3,0');
        towerRight.setAttribute('fill', '#ecf0f1'); // Светлая грань
        g.appendChild(towerRight);

        // 2. ГОНДОЛА (Корпус)
        // Основа
        const nacelleBody = document.createElementNS(svgNS, 'rect');
        nacelleBody.setAttribute('x', '-2'); nacelleBody.setAttribute('y', '-54');
        nacelleBody.setAttribute('width', '4'); nacelleBody.setAttribute('height', '4');
        nacelleBody.setAttribute('fill', '#bdc3c7');
        nacelleBody.setAttribute('rx', '1.5');
        g.appendChild(nacelleBody);

        // Верх (блик)
        const nacelleTop = document.createElementNS(svgNS, 'ellipse');
        nacelleTop.setAttribute('cx', '0'); nacelleTop.setAttribute('cy', '-54');
        nacelleTop.setAttribute('rx', '2'); nacelleTop.setAttribute('ry', '1');
        nacelleTop.setAttribute('fill', '#ffffff');
        g.appendChild(nacelleTop);

        // 3. РОТОР (Лопасти)
        const rotorWrapper = document.createElementNS(svgNS, 'g');
        // Прикрепляем к передней части гондолы и немного сплющиваем для изометрии
        rotorWrapper.setAttribute('transform', 'translate(-2, -52) scale(1, 0.7)');

        const rotorGroup = document.createElementNS(svgNS, 'g');
        rotorGroup.setAttribute('class', 'wind-rotor');

        // Создаем одну красивую 3D-лопасть
        const bladePath = document.createElementNS(svgNS, 'path');
        // Изогнутая форма, сужающаяся к концу. Без обводки (stroke), только заливка (fill).
        bladePath.setAttribute('d', 'M 0,0 C -2,-5 -1,-18 0,-24 C 1,-18 2,-5 0,0 Z');
        
        // Левая (теневая) половина лопасти
        bladePath.setAttribute('fill', '#dcdde1'); 
        // Обрезаем правую часть (визуально разделяем лопасть на две грани)
        bladePath.setAttribute('clip-path', 'inset(0 50% 0 0)'); 
        rotorGroup.appendChild(bladePath);

        // Правая (светлая) половина
        const bladeLight = document.createElementNS(svgNS, 'path');
        bladeLight.setAttribute('d', 'M 0,0 C -2,-5 -1,-18 0,-24 C 1,-18 2,-5 0,0 Z');
        bladeLight.setAttribute('fill', '#ffffff');
        bladeLight.setAttribute('clip-path', 'inset(0 0 0 50%)');
        rotorGroup.appendChild(bladeLight);

        // Дублируем лопасти с поворотом на 120 и 240 градусов
        const blade2 = bladePath.cloneNode(true);
        blade2.setAttribute('transform', 'rotate(120)');
        rotorGroup.appendChild(blade2);

        const blade2Light = bladeLight.cloneNode(true);
        blade2Light.setAttribute('transform', 'rotate(120)');
        rotorGroup.appendChild(blade2Light);

        const blade3 = bladePath.cloneNode(true);
        blade3.setAttribute('transform', 'rotate(240)');
        rotorGroup.appendChild(blade3);

        const blade3Light = bladeLight.cloneNode(true);
        blade3Light.setAttribute('transform', 'rotate(240)');
        rotorGroup.appendChild(blade3Light);

        // Ступица (оранжевый центр)
        const hub = document.createElementNS(svgNS, 'circle');
        hub.setAttribute('cx', '0'); hub.setAttribute('cy', '0');
        hub.setAttribute('r', '2.5');
        hub.setAttribute('fill', '#e67e22');
        rotorGroup.appendChild(hub);

        rotorWrapper.appendChild(rotorGroup);
        g.appendChild(rotorWrapper);

        return g;
    }

    // Ждем загрузки карты и добавляем ветряк
    setTimeout(() => {
